<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hola Mundo</title>
        <style>
    body {
      background-color: #f4f6f9;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s ease-in-out;
    }

    .card:hover {
      transform: scale(1.05);
    }

    h1 {
      color: #1976d2;
      margin-bottom: 10px;
    }

    p {
      color: #333;
      font-size: 1.1rem;
    }
  </style>
    </head>
    <body>
        <div class="card">
            <h1>👋 ¡Hola Mundo!</h1>
            <p>Bienvenido a tu primera página con HTML y CSS.</p>
        </div>
    </body>
</html>
